<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamilton 最大余数席位分配悖论核查</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>最大余数法（Hamilton 法）席位分配悖论核查</h1>
    <p>
      录入各地区人口与席位总数起止值，系统逐个席位总数精确计算配额、整数席位与余数，
      并扫描「总席位增加一个，某地区反而失去席位」的阿拉巴马悖论。
      全部计算使用精确分数，不使用浮点排序。
    </p>
  </header>

  <main>
    <section class="card">
      <h2>1. 录入数据</h2>
      <table class="input-table">
        <thead>
          <tr><th class="col-num">#</th><th>地区名称</th><th>人口（正整数）</th><th class="col-op"></th></tr>
        </thead>
        <tbody id="region-tbody"></tbody>
      </table>
      <div class="toolbar">
        <button id="add-region" type="button">＋ 添加地区</button>
        <button id="load-example" type="button">载入可复现示例</button>
      </div>
      <div class="range-inputs">
        <label>席位总数起始值
          <input type="number" id="seat-start" min="1" step="1" value="8">
        </label>
        <label>席位总数终止值
          <input type="number" id="seat-end" min="2" step="1" value="14">
        </label>
        <span class="hint">跨度（终止值 − 起始值）不超过 500</span>
      </div>
      <div class="toolbar">
        <button id="scan-btn" class="primary" type="button">开始扫描</button>
        <button id="reset-btn" type="button">清空</button>
      </div>
      <p id="error-box" class="error" hidden></p>
    </section>

    <section id="result-section" hidden>
      <div class="card" id="summary-card"></div>
      <div id="paradox-details"></div>
      <div class="card">
        <h2>席位总览</h2>
        <p class="hint">每行对应一个总席位数下各地区的最终席位；标 ⚠ 的行表示从该档增至下一档时发生阿拉巴马悖论。</p>
        <div class="table-wrap" id="overview-wrap"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>
      决胜规则：余数较大者优先；余数相同，人口较多者优先；仍相同，录入顺序较早者优先。
      配额与余数均以精确分数计算与展示（小数为精确舍入到 6 位的展示值）。
    </p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
